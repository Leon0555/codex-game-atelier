name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert Apple Silicon host
        run: test "$(uname -m)" = arm64

      - name: Set up minimum Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.0
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install project-local validators
        run: python -m pip install --requirement tools/validators/requirements.txt

      - name: Check Go formatting
        working-directory: packages/cli
        run: |
          changed="$(gofmt -l .)"
          test -z "$changed"

      - name: Run Go vet
        working-directory: packages/cli
        run: go vet ./...

      - name: Run Go tests
        working-directory: packages/cli
        run: go test -count=1 ./...

      - name: Cross-build unsupported artifact-only entry pairs
        working-directory: packages/cli
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/codex-game-atelier-linux-amd64" ./cmd/codex-game-atelier
          GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/codex-game-atelier-runner-linux-amd64" ./cmd/codex-game-atelier-runner
          GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/codex-game-atelier-windows-amd64.exe" ./cmd/codex-game-atelier
          GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/codex-game-atelier-runner-windows-amd64.exe" ./cmd/codex-game-atelier-runner

      - name: Run Schema and distribution tests
        run: |
          python tools/validators/validate_schemas.py
          python -m unittest discover -s tools/validators -p 'test_*.py' -v

      - name: Build and smoke native CLI pair
        working-directory: packages/cli
        run: |
          go build -trimpath -o "$RUNNER_TEMP/codex-game-atelier" ./cmd/codex-game-atelier
          go build -trimpath -o "$RUNNER_TEMP/codex-game-atelier-runner" ./cmd/codex-game-atelier-runner
          "$RUNNER_TEMP/codex-game-atelier" --version
          set +e
          "$RUNNER_TEMP/codex-game-atelier-runner"
          runner_exit="$?"
          set -e
          test "$runner_exit" -eq 125
